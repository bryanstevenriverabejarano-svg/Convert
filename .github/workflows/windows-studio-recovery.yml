name: Windows Studio recovery checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check the recovery command using fake processes (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/test_studio_recovery.ps1
