name: Android tests and APK

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Tests and debug APK (ARM64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-dependency-path: |
            build.gradle
            settings.gradle
            gradle.properties
            gradle/gradle-daemon-jvm.properties
            gradle/wrapper/gradle-wrapper.properties
            app/build.gradle
            mlc4j/build.gradle

      - name: Test the voice timing report
        run: python3 -m unittest discover -s scripts -p test_summarize_voice_metrics.py -v

      - name: Prepare Android SDK 36 and Build Tools 36.0.0
        timeout-minutes: 10
        run: bash scripts/setup-android-sdk.sh

      - name: Run JVM tests and build the ARM64 APK
        timeout-minutes: 30
        # The checked-in daemon criteria still select/download JetBrains JDK 21.
        # TVM runtime fetching and generative model downloads are not build tasks.
        run: >-
          bash ./gradlew --no-daemon --stacktrace --console=plain --max-workers=2
          --init-script scripts/android-arm64.init.gradle
          :app:testDebugUnitTest :app:assembleDebug

      - name: Verify APK signature and record checksum
        run: |
          apk_path=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk_path"
          sha256sum "$apk_path" > "$apk_path.sha256"

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-test-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            build/reports/problems/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload tested debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salve-debug-arm64-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
