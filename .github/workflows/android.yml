name: Android tests and APK

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Tests and ${{ matrix.variant }} APK (ARM64)
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: debug
            task_suffix: Debug
            package_id: com.salve.app
            label: Salve
          - variant: preview
            task_suffix: Preview
            package_id: com.salve.app.preview
            label: Salve (prueba)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-dependency-path: |
            build.gradle
            settings.gradle
            gradle.properties
            gradle/gradle-daemon-jvm.properties
            gradle/wrapper/gradle-wrapper.properties
            app/build.gradle
            mlc4j/build.gradle

      - name: Test evaluation oracles, memory queries and development scripts
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          bash scripts/test-research-kernel.sh

      - name: Verify transparent Salve sprites and body animation
        run: |
          python3 -m pip install 'Pillow==11.3.0'
          python3 scripts/verify_salve_sprites.py
          bash scripts/test-salve-sprites.sh

      - name: Prepare Android SDK 36 and Build Tools 36.0.0
        timeout-minutes: 10
        run: bash scripts/setup-android-sdk.sh

      - name: Run JVM tests and build the ARM64 APK
        timeout-minutes: 30
        # The checked-in daemon criteria still select/download JetBrains JDK 21.
        # TVM runtime fetching and generative model downloads are not build tasks.
        # Compile errors and failing tests are also published as one annotation, readable
        # through the checks API without downloading the full log.
        run: |
          set -o pipefail
          mkdir -p build
          if ! bash ./gradlew --no-daemon --stacktrace --console=plain --max-workers=2 \
              --init-script scripts/android-arm64.init.gradle \
              :app:test${{ matrix.task_suffix }}UnitTest :app:assemble${{ matrix.task_suffix }} 2>&1 | tee build/gradle.log; then
            summary=$(grep -E "error:|FAILED|What went wrong|Exception at|expected:<|\.java:[0-9]+" build/gradle.log | grep -v "^\s*at " | head -40)
            summary="${summary//'%'/'%25'}"; summary="${summary//$'\n'/'%0A'}"
            echo "::error title=Gradle::${summary}"
            exit 1
          fi

      - name: Compile opt-in real device inference tests
        if: matrix.variant == 'debug'
        run: >-
          bash ./gradlew --no-daemon --console=plain --max-workers=2
          --init-script scripts/android-arm64.init.gradle
          :app:assembleDebugAndroidTest

      - name: Execute 104 autonomous tool challenges in four rounds
        timeout-minutes: 5
        run: python3 scripts/run_autonomous_tool_evaluation.py --output build/autonomy-evaluation

      - name: Check new inputs after freezing the solver
        timeout-minutes: 5
        run: python3 scripts/evaluate_autonomy_generalization.py --output build/autonomy-generalization

      - name: Verify APK identity, signature and checksum
        env:
          EXPECTED_PACKAGE: ${{ matrix.package_id }}
          EXPECTED_LABEL: ${{ matrix.label }}
        run: |
          apk_path=app/build/outputs/apk/${{ matrix.variant }}/app-${{ matrix.variant }}.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk_path" | tee "$apk_path.signing.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk_path" > "$apk_path.badging.txt"
          sha256sum "$apk_path" > "$apk_path.sha256"
          python3 - <<'PYTHON'
          import hashlib
          import os
          from pathlib import Path
          import re
          import zipfile
          apk_path = Path("app/build/outputs/apk/${{ matrix.variant }}/app-${{ matrix.variant }}.apk")
          badging = Path(str(apk_path) + ".badging.txt").read_text()
          package = re.search(r"^package: name='([^']+)'", badging, re.MULTILINE)
          label = re.search(r"^application-label:'([^']+)'", badging, re.MULTILINE)
          assert package and package.group(1) == os.environ["EXPECTED_PACKAGE"], badging
          assert label and label.group(1) == os.environ["EXPECTED_LABEL"], badging
          print(f"Verified install identity: {package.group(1)} ({label.group(1)})")
          with zipfile.ZipFile("app/build/outputs/apk/${{ matrix.variant }}/app-${{ matrix.variant }}.apk") as apk:
              names = set(apk.namelist())
              for name in ("base", "views", "walk", "dance", "poses"):
                  asset = "avatar/realistic/" + name + ".png"
                  assert apk.read("assets/" + asset) == Path("app/src/main/assets/" + asset).read_bytes(), asset
              assert apk.read("assets/avatar/realistic/manifest.json") == Path("app/src/main/assets/avatar/realistic/manifest.json").read_bytes()
              for constraint in ("cognitive_reply.schema.json", "cognitive_reply.gbnf"):
                  resource = "salve/" + constraint
                  assert apk.read(resource) == Path("app/src/main/resources/" + resource).read_bytes(), resource
          assert not any(name.startswith("assets/avatar3d/") or name.endswith(".glb") for name in names), "Retired 3D assets remain in APK"
          abis = {name.split("/")[1] for name in names if name.startswith("lib/") and name.endswith(".so")}
          assert abis == {"arm64-v8a"}, f"Unexpected APK ABIs: {abis}"
          assert "lib/arm64-v8a/libsalve_llama.so" in names, "Missing GGUF runtime"
          print("ARM64-only APK includes the Dolphin GGUF runtime")
          PYTHON

      - name: Verify every native library supports 16 KB pages
        run: |
          python3 scripts/check_android_native_alignment.py app/build/outputs/apk/${{ matrix.variant }}/app-${{ matrix.variant }}.apk --report build/native-alignment-${{ matrix.variant }}.json
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/${{ matrix.variant }}/app-${{ matrix.variant }}.apk

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-${{ matrix.variant }}-test-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/test${{ matrix.task_suffix }}UnitTest/
            app/build/test-results/test${{ matrix.task_suffix }}UnitTest/
            build/reports/problems/
            build/autonomy-evaluation/
            build/autonomy-generalization/
            build/native-alignment-${{ matrix.variant }}.json
            app/schemas/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload tested ${{ matrix.variant }} APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salve-${{ matrix.variant }}-arm64-${{ github.sha }}
          path: |
            app/build/outputs/apk/${{ matrix.variant }}/app-${{ matrix.variant }}.apk
            app/build/outputs/apk/${{ matrix.variant }}/app-${{ matrix.variant }}.apk.sha256
            app/build/outputs/apk/${{ matrix.variant }}/app-${{ matrix.variant }}.apk.signing.txt
            app/build/outputs/apk/${{ matrix.variant }}/app-${{ matrix.variant }}.apk.badging.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  agent-sandbox:
    name: Agent tools in real isolated containers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the disposable Python and Chromium image
        run: |
          docker build --iidfile /tmp/salve-agent-image scripts/agent_sandbox
          echo "SALVE_AGENT_IMAGE=$(cat /tmp/salve-agent-image)" >> "$GITHUB_ENV"
      - name: Exercise authentication, public reads and actual sandbox isolation
        env:
          SALVE_RUN_AGENT_DOCKER: '1'
        run: python3 -m unittest discover -s scripts -p test_agent_bridge.py -v

  cognitive-constraints:
    name: JSON Schema and native GBNF contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Build the pinned native grammar validator
        run: |
          cmake -S scripts/cognitive-grammar -B build/cognitive-grammar -DCMAKE_BUILD_TYPE=Release
          cmake --build build/cognitive-grammar --target salve-grammar-check --parallel 2
      - name: Validate both formats against accepted and rejected outputs
        run: |
          python3 -m pip install 'jsonschema==4.25.1'
          python3 scripts/check_cognitive_constraints.py --validator build/cognitive-grammar/salve-grammar-check
