name: Publicar APK de Salve

# Cada vez que main cambia, compila Salve y deja los APK en la release fija «salve-ultima».
# Enlaces que no cambian nunca y se descargan sin iniciar sesión ni descomprimir:
#   https://github.com/<dueño>/<repo>/releases/download/salve-ultima/salve-preview-arm64.apk
#   https://github.com/<dueño>/<repo>/releases/download/salve-ultima/salve-debug-arm64.apk
# Releases no gasta la cuota de artefactos de Actions. Este flujo solo compila (no ejecuta código de la
# app) y es el único con permiso de escritura para crear la release; las pruebas siguen en android.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: salve-release
  cancel-in-progress: true

jobs:
  publicar:
    name: Compilar y publicar los APK
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-read-only: true
          cache-dependency-path: |
            build.gradle
            settings.gradle
            gradle.properties
            gradle/gradle-daemon-jvm.properties
            gradle/wrapper/gradle-wrapper.properties
            app/build.gradle
            mlc4j/build.gradle

      - name: Prepare Android SDK
        timeout-minutes: 10
        run: bash scripts/setup-android-sdk.sh

      - name: Use Salve's fixed signing key (updates keep her data)
        env:
          SALVE_DEBUG_KEYSTORE_B64: ${{ secrets.SALVE_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$SALVE_DEBUG_KEYSTORE_B64" ]; then
            printf '%s' "$SALVE_DEBUG_KEYSTORE_B64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/salve-debug.keystore"
            echo "SALVE_DEBUG_KEYSTORE=$RUNNER_TEMP/salve-debug.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin SALVE_DEBUG_KEYSTORE_B64 el APK usa una firma aleatoria."
          fi

      - name: Build the Hexagon v75 NPU libraries (Galaxy S24 Ultra) from the pinned llama.cpp
        timeout-minutes: 30
        run: |
          set -euo pipefail
          mkdir -p build/qualcomm-dist
          docker run --rm --platform linux/amd64 \
            --volume "$PWD:/workspace" \
            --workdir /workspace/third_party/llama.cpp \
            ghcr.io/snapdragon-toolchain/arm64-android:v0.8@sha256:e39e5e9c0957550a92c0de756b7556d81196c7c7f7328ed80de252bfb4878adf \
            bash -euc '
              cp docs/backend/snapdragon/CMakeUserPresets.json .
              cmake --preset arm64-android-snapdragon-release \
                -B /workspace/build/qualcomm-llama \
                -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON \
                -DGGML_BACKEND_DL=ON -DBUILD_SHARED_LIBS=ON \
                -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384" \
                -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
                -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_TOOLS=OFF
              cmake --build /workspace/build/qualcomm-llama \
                --target ggml-hexagon htp-v75 --parallel 2
              cp /workspace/build/qualcomm-llama/bin/libggml-hexagon.so \
                /workspace/build/qualcomm-dist/libggml-hexagon.so
              cp /workspace/build/qualcomm-llama/ggml/src/ggml-hexagon/libggml-htp-v75.so \
                /workspace/build/qualcomm-dist/libggml-htp-v75.so
            '
          test -s build/qualcomm-dist/libggml-hexagon.so
          test -s build/qualcomm-dist/libggml-htp-v75.so
          file build/qualcomm-dist/*.so
          readelf -h build/qualcomm-dist/libggml-hexagon.so | grep -E 'Machine:.*AArch64'
          # The host module is built apart (Qualcomm preset, its own STL/LTO) but binds at runtime to
          # Salve's libggml-base.so: it must need nothing the APK does not ship or the system lacks.
          readelf -d build/qualcomm-dist/libggml-hexagon.so | grep NEEDED
          readelf -d build/qualcomm-dist/libggml-hexagon.so | grep NEEDED | grep -oE '\[[^]]+\]' | tr -d '[]' | while read -r lib; do
            case "$lib" in
              libggml-base.so|libggml.so|libc++_shared.so|libc.so|libm.so|libdl.so|liblog.so|libandroid.so|libcdsprpc.so) ;;
              *) echo "Unexpected dependency of libggml-hexagon.so: $lib"; exit 1 ;;
            esac
          done
          # Module MUST export the GGML entry point for ggml_backend_load() in Salve.
          readelf --wide --dyn-syms build/qualcomm-dist/libggml-hexagon.so \
            | grep -E '[[:space:]]ggml_backend_init$'

      - name: Build the ARM64 APKs
        timeout-minutes: 35
        # Con las bibliotecas Hexagon: la app prueba la NPU solo en un SM8650 y vuelve sola a GPU/CPU si falla.
        env:
          SALVE_ENABLE_HEXAGON: '1'
          SALVE_HEXAGON_ARM64_LIB: ${{ github.workspace }}/build/qualcomm-dist/libggml-hexagon.so
          SALVE_HEXAGON_SKEL_V75: ${{ github.workspace }}/build/qualcomm-dist/libggml-htp-v75.so
        run: >-
          bash ./gradlew --no-daemon --console=plain --max-workers=2
          --init-script scripts/android-arm64.init.gradle
          :app:assemblePreview :app:assembleDebug

      - name: Publish them in the «salve-ultima» release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/preview/app-preview.apk dist/salve-preview-arm64.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/salve-debug-arm64.apk
          ( cd dist && sha256sum *.apk > SHA256SUMS.txt )
          short="${GITHUB_SHA::7}"
          notes="Salve compilada desde main (${short}) el $(date -u '+%Y-%m-%d %H:%M') UTC.

          - **salve-preview-arm64.apk**: la versión para instalar (app «Salve (prueba)»).
          - **salve-debug-arm64.apk**: la misma con registros de depuración (app «Salve»).

          Se instala directamente: no hace falta iniciar sesión ni descomprimir.
          Las pruebas de esta revisión están en «Android tests and APK»."
          # La release se rehace en cada versión para que su etiqueta apunte siempre al último main.
          gh release delete salve-ultima --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          gh release create salve-ultima dist/salve-preview-arm64.apk dist/salve-debug-arm64.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Salve · última versión (${short})" --notes "$notes"
          echo "Publicada: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/salve-ultima"
