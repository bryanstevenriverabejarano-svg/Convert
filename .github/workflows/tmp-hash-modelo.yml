# Temporal: tamaño, commit y SHA-256 del Qwen 3.5 4B (solo cabeceras) y su cabecera GGUF.
name: tmp hash modelo
on:
  push:
    branches: [tmp/hash-modelo-qwen35]
permissions: {}
jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - name: Cabeceras
        run: |
          for Q in Q4_K_M Q6_K; do
            URL="https://huggingface.co/HauhauCS/Qwen3.5-4B-Uncensored-HauhauCS-Aggressive/resolve/main/Qwen3.5-4B-Uncensored-HauhauCS-Aggressive-$Q.gguf"
            echo "== $Q"; curl -sSI "$URL" | grep -iE "^(HTTP|x-linked-size|x-linked-etag|x-repo-commit):" || true
          done
          URL="https://huggingface.co/HauhauCS/Qwen3.5-4B-Uncensored-HauhauCS-Aggressive/resolve/main/Qwen3.5-4B-Uncensored-HauhauCS-Aggressive-Q4_K_M.gguf"
          curl -sSL -r 0-41943039 -o head.gguf "$URL"
          python3 - <<'PY'
          import struct
          data = open("head.gguf","rb").read(); off = 4
          def rd(fmt):
              global off
              v = struct.unpack_from("<"+fmt, data, off)[0]; off += struct.calcsize("<"+fmt); return v
          def rstr():
              global off
              n = rd("Q"); s = data[off:off+n].decode("utf-8","replace"); off += n; return s
          rd("I"); rd("Q"); nkv = rd("Q")
          sizes = {0:"B",1:"b",2:"H",3:"h",4:"I",5:"i",6:"f",7:"?",10:"Q",11:"q",12:"d"}
          def val(t):
              if t == 8: return rstr()
              if t == 9:
                  at = rd("I"); n = rd("Q"); items = [val(at) for _ in range(n)]
                  return f"[array {n}]"
              return rd(sizes[t])
          for _ in range(nkv):
              k = rstr(); t = rd("I"); v = val(t)
              if k in ("general.architecture","general.name","general.size_label") or k.endswith(".block_count") or k.endswith(".context_length"):
                  print(k, "=", v)
              if k == "tokenizer.chat_template":
                  print("enable_thinking en plantilla:", "enable_thinking" in v)
          PY
