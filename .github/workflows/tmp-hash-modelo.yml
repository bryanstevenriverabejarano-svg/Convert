name: tmp hash modelo
on:
  push:
    branches: [tmp/hash-modelo-qwen35]
permissions: {}
jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - name: Datos
        run: |
          curl -sSL -o v.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-es_ES-sharvard-medium.tar.bz2
          tar xjf v.tar.bz2
          curl -sSL -o hf-tokens.txt https://huggingface.co/csukuangfj/vits-piper-es_ES-sharvard-medium/resolve/2306b73bae558eddfdaee0a7ef3048a966a291d4/tokens.txt
          sha256sum hf-tokens.txt vits-piper-es_ES-sharvard-medium/tokens.txt
          cd vits-piper-es_ES-sharvard-medium/espeak-ng-data && ls | grep -v _dict; du -sh es_dict; du -ch $(ls | grep -v "_dict$") | tail -1
