# Temporal: tamaño, commit y SHA-256 de los mmproj de Gemma 4 E2B/E4B sin censura.
name: tmp hash modelo
on:
  push:
    branches: [tmp/hash-modelo-qwen35]
permissions: {}
jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - name: Cabeceras
        run: |
          for M in E2B E4B; do
            URL="https://huggingface.co/HauhauCS/Gemma-4-$M-Uncensored-HauhauCS-Aggressive/resolve/main/mmproj-Gemma-4-$M-Uncensored-HauhauCS-Aggressive-f16.gguf"
            echo "== $M"; curl -sSI "$URL" | grep -iE "^(HTTP|x-linked-size|x-linked-etag|x-repo-commit):" || true
            curl -sSL -r 0-8388607 -o head-$M.gguf "$URL"
            python3 - "head-$M.gguf" <<'PY'
          import struct, sys
          data = open(sys.argv[1],"rb").read(); off = 4
          def rd(fmt):
              global off
              v = struct.unpack_from("<"+fmt, data, off)[0]; off += struct.calcsize("<"+fmt); return v
          def rstr():
              global off
              n = rd("Q"); s = data[off:off+n].decode("utf-8","replace"); off += n; return s
          rd("I"); ntens = rd("Q"); nkv = rd("Q")
          sizes = {0:"B",1:"b",2:"H",3:"h",4:"I",5:"i",6:"f",7:"?",10:"Q",11:"q",12:"d"}
          def val(t):
              if t == 8: return rstr()
              if t == 9:
                  at = rd("I"); n = rd("Q"); items = [val(at) for _ in range(n)]
                  return f"[array {n}]"
              return rd(sizes[t])
          for _ in range(nkv):
              k = rstr(); t = rd("I"); v = val(t)
              if k.startswith("clip.") and ("has_" in k or "projector" in k) or k == "general.architecture":
                  print(k, "=", v)
          PY
          done
