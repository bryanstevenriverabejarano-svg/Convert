name: Salve Nodo para Windows (.exe)

on:
  push:
    paths:
      - 'scripts/salve_*.py'
      - 'scripts/requirements-family.txt'
      - '.github/workflows/windows-node.yml'
  pull_request:
    paths:
      - 'scripts/salve_*.py'
      - 'scripts/requirements-family.txt'
      - '.github/workflows/windows-node.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements-family.txt pyinstaller==6.11.1

      - name: Pruebas del nodo en Windows
        working-directory: scripts
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        # Los fallos se publican también como anotación (legible sin descargar el log completo).
        run: |
          set -o pipefail
          if ! { python salve_nodo_app.py --autoprueba && python -m unittest test_private_network.PrivateNetworkSetupTests test_private_network.LocationVersionTests test_guardian -v; } 2>&1 | tee pruebas.log; then
            summary=$(grep -E "Error|error|FAIL|Traceback|assert|File \"" pruebas.log | tail -25)
            summary="${summary//'%'/'%25'}"; summary="${summary//$'\n'/'%0A'}"
            echo "::error title=Pruebas Windows::${summary}"
            exit 1
          fi

      - name: Empaquetar SalveNodo.exe
        working-directory: scripts
        run: >
          pyinstaller --onefile --console --clean --name SalveNodo
          --collect-submodules qrcode
          --hidden-import salve_compute_node --hidden-import salve_private_network
          --hidden-import salve_private_location --hidden-import salve_node_setup --hidden-import salve_guardian
          salve_nodo_app.py

      - name: Probar el .exe empaquetado (sin Python)
        working-directory: scripts
        run: |
          .\dist\SalveNodo.exe --version
          .\dist\SalveNodo.exe --autoprueba

      - name: Publicar el ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: SalveNodo-windows-${{ github.sha }}
          path: scripts/dist/SalveNodo.exe
          retention-days: 30
