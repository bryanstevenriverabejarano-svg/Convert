plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Keep multi-GB language model weights out of APKs, including future accidental additions.
def verifyExternalLlmWeights = tasks.register('verifyExternalLlmWeights') {
    doLast {
        def bundled = fileTree('src/main/assets') {
            include '**/*.litertlm', '**/*.task', '**/*.gguf'
        }
        if (!bundled.isEmpty()) {
            throw new GradleException('Los pesos LLM deben descargarse desde config/models.json, no incluirse en assets.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn(verifyExternalLlmWeights) }

// Su propio código, resumido, dentro de la app: así Salve puede consultarse a sí misma sin red.
// Por cada archivo: ruta, líneas, qué hace (su comentario de clase) y sus funciones con su comentario.
def selfCodeDir = layout.buildDirectory.dir('generated/selfCode')
def generateSelfCodeIndex = tasks.register('generateSelfCodeIndex') {
    def sources = fileTree('src/main/java') { include '**/*.java', '**/*.kt' }
    def avatar = fileTree('src/main/assets/avatar')
    inputs.files(sources)
    inputs.files(avatar)
    outputs.dir(selfCodeDir)
    doLast {
        def clean = { String c ->
            c.replaceAll(/(?s)^\/\*\*|\*\/$/, '').readLines().collect { it.replaceFirst(/^\s*\*\s?/, '').trim() }
                    .findAll { it && !it.startsWith('@') }.join(' ')
                    .replaceAll(/\{@\w+\s+([^}]*)\}/, '$1').replaceAll(/<[^>]+>/, '').replaceAll(/\s+/, ' ').trim()
        }
        def cut = { String t, int n -> t.length() > n ? t.substring(0, n - 1) + '…' : t }
        def root = file('src/main/java').toPath()
        def files = []
        sources.files.sort { it.path }.each { f ->
            def text = f.getText('UTF-8')
            def lines = text.readLines()
            def classDoc = ''
            def m = (text =~ /(?s)(\/\*\*(?:(?!\*\/).)*\*\/)\s*(?:@\w+(?:\([^)]*\))?\s*)*(?:public |internal |private |final |abstract |data |sealed |open )*(?:class|interface|enum|object|record)\s/)
            if (m.find()) classDoc = cut(clean(m.group(1)), 400)
            def methods = []
            def pending = null
            def inDoc = false, docBuf = new StringBuilder()
            for (String line : lines) {
                def t = line.trim()
                if (!inDoc && t.startsWith('/**')) { inDoc = true; docBuf.setLength(0) }
                if (inDoc) {
                    docBuf.append(line).append('\n')
                    if (t.contains("*/")) { inDoc = false; pending = clean(docBuf.toString().trim()) }
                    continue
                }
                def jm = (t =~ /^(?:(?:public|protected|private|static|final|synchronized|abstract|default|native)\s+)*(?:<[^>]+>\s+)?[\w.<>\[\]?, ]+\s+(\w+)\s*\([^;]*$/)
                def km = (t =~ /^(?:(?:public|private|internal|protected|override|suspend|inline|open)\s+)*fun\s+(?:<[^>]+>\s+)?(?:[\w.]+\.)?(\w+)\s*\(/)
                String name = null
                if (km.find()) name = km.group(1)
                else if (jm.find() && !(t =~ /^(return|new|throw|else|if|for|while|switch|case)\b/)) name = jm.group(1)
                if (name != null && !(name in ['if', 'for', 'while', 'switch', 'catch', 'synchronized'])) {
                    if (methods.size() < 30) methods << (pending ? [n: name, d: cut(pending, 160)] : [n: name])
                    pending = null
                } else if (t && !t.startsWith('@') && !t.startsWith('//')) pending = null
            }
            files << [p: root.relativize(f.toPath()).toString().replace('\\', '/'), l: lines.size(), d: classDoc, m: methods]
        }
        def bodies = [:]
        file('src/main/assets/avatar').eachDir { dir ->
            def names = []
            dir.eachFile { if (it.isFile()) names << it.name }
            bodies[dir.name] = names.sort()
        }
        def out = selfCodeDir.get().file('self/codigo.json').asFile
        out.parentFile.mkdirs()
        out.setText(groovy.json.JsonOutput.toJson([version: 1, files: files, avatar: bodies]), 'UTF-8')
    }
}
tasks.named('preBuild').configure { dependsOn(generateSelfCodeIndex) }

android {

    namespace 'com.salve.app'
    compileSdk 36
    ndkVersion "27.2.12479018"
    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    defaultConfig {
        applicationId "com.salve.app"
        minSdk 26
        targetSdk 34
        ndk { abiFilters "arm64-v8a", "x86_64" }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
                // Build only app JNI libraries, not SentencePiece's desktop training/CLI tools.
                targets "salve_llama", "salve_sentencepiece"
            }
        }

        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }

        vectorDrawables {
            useSupportLibrary true
        }
    }

    // Firma fija (si CI la recibe como secreto): cada APK nuevo se instala encima del anterior y
    // Salve conserva su modelo, sus recuerdos y la autorización de pCloud. Sin el secreto, la de siempre.
    signingConfigs {
        debug {
            def fixedKeystore = System.getenv("SALVE_DEBUG_KEYSTORE")
            if (fixedKeystore != null && file(fixedKeystore).exists()) {
                storeFile file(fixedKeystore)
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        // A separate install preserves an existing Salve signed on another machine.
        preview {
            initWith debug
            applicationIdSuffix ".preview"
            versionNameSuffix "-preview"
            matchingFallbacks = ['debug']
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        viewBinding true
    }

    testOptions {
        unitTests.all {
            jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED',
                    '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED'
        }
    }

    sourceSets {
        test.resources.srcDir("$projectDir/schemas")
        main.assets.srcDir(selfCodeDir.get().asFile)
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // Avatar 3D (Filament) en pausa: el modelo está en docs/avatar3d/ hasta que se conecte a la vista.
    // Motor MLC para Java/Android (módulo local)
    implementation project(':mlc4j')

    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.10.0'
    implementation 'androidx.activity:activity-ktx:1.12.4'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.9'
    // Verificación del dueño del teléfono (rostro, huella o PIN) para la identidad de Salve.
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.google.code.gson:gson:2.14.0' // la misma que trae LiteRT-LM 0.18
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'

    // Gemini uses the REST API through the existing OkHttp/Gson dependencies.

    implementation fileTree(
            dir: 'src/main/libs',
            include: ['*.jar'],
            exclude: []
    )

    // Same Interpreter API; native runtime verified for 16 KB pages.
    implementation 'com.google.ai.edge.litert:litert:1.4.2'
    implementation 'androidx.room:room-runtime:2.8.4'
    annotationProcessor 'androidx.room:room-compiler:2.8.4'
    implementation 'androidx.work:work-runtime:2.11.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'net.lingala.zip4j:zip4j:2.11.6'

    implementation 'com.google.mlkit:vision-common:17.3.0'
    implementation 'com.google.android.gms:play-services-mlkit-face-detection:17.1.0'
    // Lector de QR de Google Play services: sin permiso de cámara propio (emparejar nodos).
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'

    // CameraX
    def camerax_version = "1.4.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // ONNX Runtime para ai.onnxruntime.*
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.24.2'

    // Real .litertlm runtime. 0.18.0 trae la decodificación especulativa (MTP) de Gemma 4 y exige Kotlin 2.4.
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.18.0'
    // Legacy .task imports keep their original engine.
    implementation 'com.google.mediapipe:tasks-genai:0.10.33'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
