plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Keep multi-GB language model weights out of APKs, including future accidental additions.
def verifyExternalLlmWeights = tasks.register('verifyExternalLlmWeights') {
    doLast {
        def bundled = fileTree('src/main/assets') {
            include '**/*.litertlm', '**/*.task', '**/*.gguf'
        }
        if (!bundled.isEmpty()) {
            throw new GradleException('Los pesos LLM deben descargarse desde config/models.json, no incluirse en assets.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn(verifyExternalLlmWeights) }

android {

    namespace 'com.salve.app'
    compileSdk 36
    ndkVersion "27.2.12479018"
    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    defaultConfig {
        applicationId "com.salve.app"
        minSdk 26
        targetSdk 34
        ndk { abiFilters "arm64-v8a", "x86_64" }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
                // Build only app JNI libraries, not SentencePiece's desktop training/CLI tools.
                targets "salve_llama", "salve_sentencepiece"
            }
        }

        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }

        vectorDrawables {
            useSupportLibrary true
        }
    }

    // Firma fija (si CI la recibe como secreto): cada APK nuevo se instala encima del anterior y
    // Salve conserva su modelo, sus recuerdos y la autorización de pCloud. Sin el secreto, la de siempre.
    signingConfigs {
        debug {
            def fixedKeystore = System.getenv("SALVE_DEBUG_KEYSTORE")
            if (fixedKeystore != null && file(fixedKeystore).exists()) {
                storeFile file(fixedKeystore)
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        // A separate install preserves an existing Salve signed on another machine.
        preview {
            initWith debug
            applicationIdSuffix ".preview"
            versionNameSuffix "-preview"
            matchingFallbacks = ['debug']
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        viewBinding true
    }

    testOptions {
        unitTests.all {
            jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED',
                    '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED'
        }
    }

    sourceSets { test.resources.srcDir("$projectDir/schemas") }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation "com.wireguard.android:tunnel:1.0.20260102"
    implementation "org.osmdroid:osmdroid-android:6.1.20"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    // Avatar 3D (Filament) en pausa: el modelo está en docs/avatar3d/ hasta que se conecte a la vista.
    // Motor MLC para Java/Android (módulo local)
    implementation project(':mlc4j')

    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.10.0'
    implementation 'androidx.activity:activity-ktx:1.12.4'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.9'
    // Verificación del dueño del teléfono (rostro, huella o PIN) para la identidad de Salve.
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'

    // Gemini uses the REST API through the existing OkHttp/Gson dependencies.

    implementation fileTree(
            dir: 'src/main/libs',
            include: ['*.jar'],
            exclude: []
    )

    // Same Interpreter API; native runtime verified for 16 KB pages.
    implementation 'com.google.ai.edge.litert:litert:1.4.2'
    implementation 'androidx.room:room-runtime:2.8.4'
    annotationProcessor 'androidx.room:room-compiler:2.8.4'
    implementation 'androidx.work:work-runtime:2.11.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'net.lingala.zip4j:zip4j:2.11.6'

    implementation 'com.google.mlkit:vision-common:17.3.0'
    implementation 'com.google.android.gms:play-services-mlkit-face-detection:17.1.0'
    // Lector de QR de Google Play services: sin permiso de cámara propio (emparejar nodos).
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'

    // CameraX
    def camerax_version = "1.4.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // ONNX Runtime para ai.onnxruntime.*
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.24.2'

    // Real .litertlm runtime; 0.16.1 keeps compatibility with Kotlin 2.2 in this project.
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.16.1'
    // Legacy .task imports keep their original engine.
    implementation 'com.google.mediapipe:tasks-genai:0.10.33'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
